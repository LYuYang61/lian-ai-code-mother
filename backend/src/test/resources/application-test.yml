spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:lian_ai_code_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  session:
    store-type: none
  # 测试使用 MockHttpSession，不应因为引入 Spring Session Redis 而连接开发机 Redis。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

app:
  code-output-root: ${java.io.tmpdir}/lian-ai-code-test/output
  deploy-output-root: ${java.io.tmpdir}/lian-ai-code-test/deploy
  ai:
    chat-memory:
      enabled: false
  # 离线测试不依赖 Redis：精选列表缓存退化为 NoOp，限流直接关闭（切面放行）。
  cache:
    enabled: false
  rate-limit:
    enabled: false
