spring:
  application:
    name: lian-ai-code-mother-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  # 默认不强制连接 Redis；local profile 会开启 Redis Session，测试 profile 明确关闭它。
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}
    # Spring Session 使用该属性控制服务端会话的最大不活跃时间；不要只依赖 Servlet 容器配置。
    timeout: ${SESSION_TIMEOUT:30d}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

server:
  # Windows IDEA 默认直接运行 backend；前端 Vite 通过代理访问该端口。
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    session:
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}

# springdoc 是 Knife4j OpenAPI 3 starter 的底层规范生成器。
springdoc:
  # 保留底层 OpenAPI 端点，供 Knife4j 页面和前端类型生成共同使用。
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      # 只扫描当前项目的 Controller，避免把框架端点暴露到业务文档中。
      paths-to-match: '/**'
      packages-to-scan: com.lian.aicode.controller

# Knife4j 提供中文增强文档页，访问地址为 /api/doc.html。
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

app:
  # AI 生成代码的落盘根目录；Vue 工程模式还会在版本目录下生成受控的 dist 构建产物。
  code-output-root: ${CODE_OUTPUT_ROOT:${user.dir}/tmp/code_output}
  deploy-output-root: ${CODE_DEPLOY_ROOT:${user.dir}/tmp/code_deploy}
  deploy:
    # 开发环境由 Spring Boot 自己提供静态文件；生产环境可改成 Nginx 或对象存储域名。
    public-base-url: ${APP_DEPLOY_PUBLIC_BASE_URL:http://localhost:8123/api/site}
  preview:
    # 截图浏览器需要绝对地址；外部访问地址变化时通过环境变量覆盖。
    public-base-url: ${APP_PREVIEW_PUBLIC_BASE_URL:http://localhost:8123/api/preview}
  screenshot:
    # 截图、阿里云 OSS 和 Chrome 都是可选能力；关闭时部署与基础预览不受影响。
    enabled: ${APP_SCREENSHOT_ENABLED:false}
    scheduling-enabled: ${APP_SCREENSHOT_SCHEDULING_ENABLED:false}
    max-concurrent: ${APP_SCREENSHOT_MAX_CONCURRENT:1}
    queue-capacity: ${APP_SCREENSHOT_QUEUE_CAPACITY:20}
    viewport-width: ${APP_SCREENSHOT_VIEWPORT_WIDTH:1600}
    viewport-height: ${APP_SCREENSHOT_VIEWPORT_HEIGHT:900}
    page-load-timeout: ${APP_SCREENSHOT_PAGE_LOAD_TIMEOUT:30s}
    wait-timeout: ${APP_SCREENSHOT_WAIT_TIMEOUT:15s}
    temp-file-ttl: ${APP_SCREENSHOT_TEMP_FILE_TTL:2h}
    failure-retry-delay: ${APP_SCREENSHOT_FAILURE_RETRY_DELAY:5m}
    temp-root: ${APP_SCREENSHOT_TEMP_ROOT:${user.dir}/tmp/screenshots}
    # 这是截图浏览器的 SSRF 边界；使用外部部署域名时必须显式加入允许主机。
    allowed-hosts: ${APP_SCREENSHOT_ALLOWED_HOSTS:localhost,127.0.0.1}
    retry-batch-size: ${APP_SCREENSHOT_RETRY_BATCH_SIZE:20}
  storage:
    # 限制单条提示词，避免把模型费用和文件系统压力无限暴露给接口调用者。
    max-prompt-length: ${APP_MAX_PROMPT_LENGTH:10000}
    # 限制单个生成文件大小，避免模型异常输出耗尽磁盘或差异接口内存。
    max-file-size-bytes: ${APP_MAX_FILE_SIZE_BYTES:2097152}
  ai:
    chat-memory:
      # 真实 local 环境默认使用 Redis；测试可关闭以避免依赖外部服务。
      enabled: ${AI_CHAT_MEMORY_ENABLED:true}
      key-prefix: ${AI_CHAT_MEMORY_KEY_PREFIX:lian:ai:chat-memory}
      ttl: ${AI_CHAT_MEMORY_TTL:86400s}
      max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:20}
      service-cache-max-size: ${AI_SERVICE_CACHE_MAX_SIZE:1000}
      service-cache-expire-after-write: ${AI_SERVICE_CACHE_EXPIRE_AFTER_WRITE:30m}
      service-cache-expire-after-access: ${AI_SERVICE_CACHE_EXPIRE_AFTER_ACCESS:10m}
  ai-workflow:
    # 第九期 AI 工作流默认可用，但只有请求显式带 agent=true 才会执行，不改变旧链路行为。
    enabled: ${AI_WORKFLOW_ENABLED:true}
    max-quality-retries: ${AI_WORKFLOW_MAX_QUALITY_RETRIES:2}
    quality-check-enabled: ${AI_WORKFLOW_QUALITY_CHECK_ENABLED:true}
    quality-fail-open: ${AI_WORKFLOW_QUALITY_FAIL_OPEN:true}
    quality-hard-fail: ${AI_WORKFLOW_QUALITY_HARD_FAIL:false}
    quality-max-code-chars: ${AI_WORKFLOW_QUALITY_MAX_CODE_CHARS:120000}
    quality-max-files: ${AI_WORKFLOW_QUALITY_MAX_FILES:80}
    # 工作流自产生的 Mermaid/Logo 对象统一写入这个 OSS 对象前缀下，不写入本地代码目录。
    storage-prefix: ${AI_WORKFLOW_STORAGE_PREFIX:workflow}
    image-collection:
      enabled: ${AI_WORKFLOW_IMAGE_COLLECTION_ENABLED:true}
      max-plan-tasks: ${AI_WORKFLOW_IMAGE_MAX_PLAN_TASKS:6}
      max-images: ${AI_WORKFLOW_IMAGE_MAX_IMAGES:24}
      parallelism: ${AI_WORKFLOW_IMAGE_PARALLELISM:4}
      timeout: ${AI_WORKFLOW_IMAGE_TIMEOUT:45s}
    mermaid:
      # Windows 可设置为 mmdc.cmd；Linux/WSL 可设置为 mmdc。参数由程序以参数列表传入，避免命令注入。
      command: ${MERMAID_CLI_COMMAND:mmdc}
      timeout: ${AI_WORKFLOW_MERMAID_TIMEOUT:30s}
      max-source-chars: ${AI_WORKFLOW_MERMAID_MAX_SOURCE_CHARS:20000}
    dashscope:
      enabled: ${AI_WORKFLOW_DASHSCOPE_ENABLED:true}
      model: ${DASHSCOPE_IMAGE_MODEL:wan2.2-t2i-flash}
      timeout: ${AI_WORKFLOW_DASHSCOPE_TIMEOUT:90s}
  collaboration:
    max-members: ${APP_COLLABORATION_MAX_MEMBERS:20}
  cache:
    # 首页精选列表等只读列表的旁路缓存开关；关闭时使用 NoOp 缓存管理器，行为等同无缓存。
    enabled: ${APP_CACHE_ENABLED:true}
    # 默认缓存区域过期时间；精选列表单独配置更短的 TTL。
    default-ttl: ${APP_CACHE_DEFAULT_TTL:30m}
    good-app-page-ttl: ${APP_CACHE_GOOD_APP_PAGE_TTL:5m}
    # 智能路由结果缓存（成本优化）：相同需求描述直接复用上一次路由结论，减少模型调用。
    codegen-route:
      enabled: ${AI_ROUTE_CACHE_ENABLED:true}
      ttl: ${AI_ROUTE_CACHE_TTL:6h}
      key-prefix: ${AI_ROUTE_CACHE_KEY_PREFIX:lian:cache:codegen-route}
  rate-limit:
    # AI 对话接口限流开关；开启后 Redis 不可用时自动降级放行（fail-open），不阻塞业务。
    enabled: ${RATE_LIMIT_ENABLED:true}
    # /app/chat/gen/code 的用户级限流参数，覆盖 @RateLimit 注解上的默认值。
    chat-gen-code:
      rate: ${RATE_LIMIT_CHAT_GEN_CODE_RATE:5}
      interval-seconds: ${RATE_LIMIT_CHAT_GEN_CODE_INTERVAL:60}
  chat-history:
    max-message-length: ${CHAT_HISTORY_MAX_MESSAGE_LENGTH:20000}
    cursor-page-size: ${CHAT_HISTORY_CURSOR_PAGE_SIZE:10}
    summary-trigger-count: ${CHAT_HISTORY_SUMMARY_TRIGGER_COUNT:40}
    summary-executor-core-size: ${CHAT_HISTORY_SUMMARY_EXECUTOR_CORE_SIZE:1}
    summary-executor-max-size: ${CHAT_HISTORY_SUMMARY_EXECUTOR_MAX_SIZE:2}
    summary-executor-queue-capacity: ${CHAT_HISTORY_SUMMARY_EXECUTOR_QUEUE_CAPACITY:50}
  web:
    async:
      # SSE 使用有界 MVC 异步线程池；长任务超时可通过环境变量调整，避免使用默认无限创建线程的执行器。
      core-size: ${MVC_ASYNC_CORE_SIZE:4}
      max-size: ${MVC_ASYNC_MAX_SIZE:16}
      queue-capacity: ${MVC_ASYNC_QUEUE_CAPACITY:200}
      timeout: ${MVC_ASYNC_TIMEOUT:30m}
  vue-project:
    # 工具调用是“不可信模型输出”进入文件系统的边界，容量限制必须可配置且有默认值。
    max-files: ${VUE_PROJECT_MAX_FILES:80}
    max-total-bytes: ${VUE_PROJECT_MAX_TOTAL_BYTES:10485760}
    max-file-size-bytes: ${VUE_PROJECT_MAX_FILE_SIZE_BYTES:2097152}
    install-timeout: ${VUE_PROJECT_INSTALL_TIMEOUT:10m}
    build-timeout: ${VUE_PROJECT_BUILD_TIMEOUT:5m}
  cors:
    # 不使用 * + allowCredentials；如 Windows 前端端口改变，通过环境变量覆盖。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# LangChain4j OpenAI-compatible 模型配置。
# 故意不在主配置中填写 api-key：没有密钥时 starter 不会创建模型，单元测试也不会访问外部服务。
# 启用 local profile 后，在 application-local.yml 中通过 ${DEEPSEEK_API_KEY} 提供密钥。
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      # DeepSeek 官方当前模型名为 deepseek-flash（对应 V4.1-Flash）；通过环境变量保留替换能力。
      model-name: ${AI_MODEL_NAME:deepseek-flash}
      max-tokens: ${AI_MAX_TOKENS:16384}
      max-retries: ${AI_MAX_RETRIES:2}
      response-format: ${AI_RESPONSE_FORMAT:json_object}
      # 永不在应用日志中输出模型请求或完整模型响应；需要调试时应使用脱敏代理或专用观测环境。
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      model-name: ${AI_MODEL_NAME:deepseek-flash}
      max-tokens: ${AI_MAX_TOKENS:16384}
      # 设置 AI_RETURN_THINKING=true 后，TokenStreamAdapter 会把思考片段作为 thinking 事件返回。
      return-thinking: ${AI_RETURN_THINKING:false}
      reasoning-effort: ${AI_REASONING_EFFORT:high}
      # DeepSeek 思考模式在服务端默认开启（returnThinking=false 也关不掉），推理 token 计入 max-tokens；
      # 2026-09-23 实测复杂需求出现"推理耗尽预算零正文"和"读而不写空转"。代码生成显式关闭思考，
      # 与这套提示词设计的非思考模型行为对齐；如需实验可通过 AI_THINKING_MODE=enabled 重新打开。
      custom-parameters:
        thinking:
          type: ${AI_THINKING_MODE:disabled}
      # 永不在应用日志中输出模型请求或完整模型响应；需要调试时应使用脱敏代理或专用观测环境。
      log-requests: false
      log-responses: false
    # 路由只返回枚举，独立配置不继承主模型的 response-format=json_object。
    # 默认复用已配置的 DeepSeek Key；也可通过 AI_ROUTING_API_KEY 使用低成本专用模型。
    routing-chat-model:
      base-url: ${AI_ROUTING_BASE_URL:${AI_BASE_URL:https://api.deepseek.com}}
      api-key: ${AI_ROUTING_API_KEY:${DEEPSEEK_API_KEY:}}
      model-name: ${AI_ROUTING_MODEL_NAME:${AI_MODEL_NAME:deepseek-flash}}
      max-tokens: ${AI_ROUTING_MAX_TOKENS:128}
      temperature: ${AI_ROUTING_TEMPERATURE:0.0}
      log-requests: false
      log-responses: false

# 阿里云 OSS 默认关闭；AccessKey 只从 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET 环境变量读取。
oss:
  client:
    enabled: ${OSS_ENABLED:false}
    # Bucket 所在地域，例如 cn-hangzhou；必须与 OSS 控制台一致。
    region: ${OSS_REGION:}
    bucket: ${OSS_BUCKET:}
    # 可选：OSS API 访问端点。使用 Bucket 默认地域端点时留空；自定义域名时填写完整 HTTPS URL。
    endpoint: ${OSS_ENDPOINT:}
    # 前端读取封面所用的公开域名（可含路径前缀），与 SDK API endpoint 分开配置。
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    # 仅当 endpoint 是已绑定到 Bucket 的 CNAME 自定义域名时设为 true。
    use-cname: ${OSS_USE_CNAME:false}
