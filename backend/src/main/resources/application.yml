spring:
  application:
    name: lian-ai-code-mother-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  # 默认不强制连接 Redis；local profile 会开启 Redis Session，测试 profile 明确关闭它。
  session:
    store-type: ${SPRING_SESSION_STORE_TYPE:none}
    # Spring Session 使用该属性控制服务端会话的最大不活跃时间；不要只依赖 Servlet 容器配置。
    timeout: ${SESSION_TIMEOUT:30d}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

server:
  # Windows IDEA 默认直接运行 backend；前端 Vite 通过代理访问该端口。
  port: ${SERVER_PORT:8123}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
    session:
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:30d}

# springdoc 是 Knife4j OpenAPI 3 starter 的底层规范生成器。
springdoc:
  # 保留底层 OpenAPI 端点，供 Knife4j 页面和前端类型生成共同使用。
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      # 只扫描当前项目的 Controller，避免把框架端点暴露到业务文档中。
      paths-to-match: '/**'
      packages-to-scan: com.lian.aicode.controller

# Knife4j 提供中文增强文档页，访问地址为 /api/doc.html。
knife4j:
  enable: ${KNIFE4J_ENABLE:true}
  setting:
    language: zh_cn

app:
  # AI 生成代码的落盘根目录。模型不能控制文件名，只能写入下方固定的三个文件。
  code-output-root: ${CODE_OUTPUT_ROOT:${user.dir}/tmp/code_output}
  deploy-output-root: ${CODE_DEPLOY_ROOT:${user.dir}/tmp/code_deploy}
  deploy:
    # 开发环境由 Spring Boot 自己提供静态文件；生产环境可改成 Nginx 或对象存储域名。
    public-base-url: ${APP_DEPLOY_PUBLIC_BASE_URL:http://localhost:8123/api/site}
  storage:
    # 限制单条提示词，避免把模型费用和文件系统压力无限暴露给接口调用者。
    max-prompt-length: ${APP_MAX_PROMPT_LENGTH:10000}
    # 限制单个生成文件大小，避免模型异常输出耗尽磁盘或差异接口内存。
    max-file-size-bytes: ${APP_MAX_FILE_SIZE_BYTES:2097152}
  ai:
    chat-memory:
      # 真实 local 环境默认使用 Redis；测试可关闭以避免依赖外部服务。
      enabled: ${AI_CHAT_MEMORY_ENABLED:true}
      key-prefix: ${AI_CHAT_MEMORY_KEY_PREFIX:lian:ai:chat-memory}
      ttl: ${AI_CHAT_MEMORY_TTL:86400s}
      max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES:20}
      service-cache-max-size: ${AI_SERVICE_CACHE_MAX_SIZE:1000}
      service-cache-expire-after-write: ${AI_SERVICE_CACHE_EXPIRE_AFTER_WRITE:30m}
      service-cache-expire-after-access: ${AI_SERVICE_CACHE_EXPIRE_AFTER_ACCESS:10m}
  collaboration:
    max-members: ${APP_COLLABORATION_MAX_MEMBERS:20}
  chat-history:
    max-message-length: ${CHAT_HISTORY_MAX_MESSAGE_LENGTH:20000}
    cursor-page-size: ${CHAT_HISTORY_CURSOR_PAGE_SIZE:10}
    summary-trigger-count: ${CHAT_HISTORY_SUMMARY_TRIGGER_COUNT:40}
    summary-executor-core-size: ${CHAT_HISTORY_SUMMARY_EXECUTOR_CORE_SIZE:1}
    summary-executor-max-size: ${CHAT_HISTORY_SUMMARY_EXECUTOR_MAX_SIZE:2}
    summary-executor-queue-capacity: ${CHAT_HISTORY_SUMMARY_EXECUTOR_QUEUE_CAPACITY:50}
  web:
    async:
      # SSE 使用有界 MVC 异步线程池；长任务超时可通过环境变量调整，避免使用默认无限创建线程的执行器。
      core-size: ${MVC_ASYNC_CORE_SIZE:4}
      max-size: ${MVC_ASYNC_MAX_SIZE:16}
      queue-capacity: ${MVC_ASYNC_QUEUE_CAPACITY:200}
      timeout: ${MVC_ASYNC_TIMEOUT:30m}
  cors:
    # 不使用 * + allowCredentials；如 Windows 前端端口改变，通过环境变量覆盖。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# LangChain4j OpenAI-compatible 模型配置。
# 故意不在主配置中填写 api-key：没有密钥时 starter 不会创建模型，单元测试也不会访问外部服务。
# 启用 local profile 后，在 application-local.yml 中通过 ${DEEPSEEK_API_KEY} 提供密钥。
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      model-name: ${AI_MODEL_NAME:deepseek-flash}
      max-tokens: ${AI_MAX_TOKENS:16384}
      max-retries: ${AI_MAX_RETRIES:2}
      response-format: ${AI_RESPONSE_FORMAT:json_object}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
    streaming-chat-model:
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      model-name: ${AI_MODEL_NAME:deepseek-flash}
      max-tokens: ${AI_MAX_TOKENS:16384}
      log-requests: ${AI_LOG_REQUESTS:false}
      log-responses: ${AI_LOG_RESPONSES:false}
